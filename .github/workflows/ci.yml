name: Python tests
on:
  push:
  pull_request:
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest -q
      - run: lidar-sim --scenario crossing --seed 0 --output results --plot
      - uses: actions/upload-artifact@v4
        with:
          name: crossing-simulation-output
          path: results/
