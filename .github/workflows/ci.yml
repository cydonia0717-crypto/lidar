name: Python tests
on:
  push:
  pull_request:
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest -q
      - run: lidar-sim --scenario crossing --seed 0 --output results --plot
      - run: lidar-eval --scenarios empty --stresses nominal --modes delay_aware,braking --seeds 1 --max-time 1 --output results/eval-smoke --plot
      # Small but real paired research pilot; output contains every episode.
      # These are synthetic scenario results, not field validation.
      - run: lidar-eval --scenarios crossing,two_targets --stresses nominal,weak_brake --modes predictive,delay_aware,braking --seeds 3 --max-time 30 --output results/eval-study --plot
      # Print exact impact/fallback chronology; keep the source traces as artifacts.
      - run: python -m lidar_sim.forensics --scenario two_targets --stresses nominal,weak_brake --modes delay_aware,braking --seeds 3 --max-time 30 --output results/forensics
      # Paired ablation isolates extra post-stop occupancy constraint.
      - run: lidar-eval --scenarios two_targets --stresses nominal,weak_brake --modes braking,braking_hold --seeds 3 --max-time 30 --output results/post-stop-ablation --plot --print-episodes
      # Paired two-stage decision benchmark; no synthetic data are fabricated.
      - run: lidar-eval --scenarios two_targets --stresses nominal,weak_brake --modes braking_hold,two_stage --seeds 2 --max-time 30 --output results/two-stage-ablation --plot --print-episodes
      # Diagnose EXACT stage and cause rejecting moving candidates (no planner change).
      - run: python -m lidar_sim.rejection_diagnostics --scenario two_targets --stress nominal --seed 0 --max-time 30 --output results/rejection-forensics
      - run: python -m lidar_sim.road_footprint_audit --seed 0 --stress nominal --output results/road-footprint-audit
      # Paired planners share the SAME true oriented-rectangle road-exit model;
      # disc is only the more conservative planning approximation.
      - run: lidar-eval --scenarios two_targets --stresses nominal,weak_brake --modes two_stage,two_stage_rectroad --physical-road-footprint rectangle --seeds 2 --seed-start 0 --max-time 30 --output results/road-geometry-known --print-episodes --plot
      # New seeds, not used in the original deadlock investigation.
      - run: lidar-eval --scenarios two_targets --stresses nominal,weak_brake --modes two_stage,two_stage_rectroad --physical-road-footprint rectangle --seeds 2 --seed-start 10 --max-time 30 --output results/road-geometry-holdout --print-episodes --plot
      - uses: actions/upload-artifact@v4
        with:
          name: crossing-simulation-output
          path: results/
