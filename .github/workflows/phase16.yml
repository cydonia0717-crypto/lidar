name: Phase16 exact fast viability parity
on:
  push:
    branches:
      - feat/fast-viability-existence-search
  workflow_dispatch:

jobs:
  phase16:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest -q tests/test_fast_viability.py tests/test_viability.py
      # Every episode uses the SAME physical truth and goal conditions.
      # Comparison intentionally includes old exhaustive policy and optimized
      # policy. all-traces enables strict per-state/per-command equivalence.
      - run: lidar-eval --scenarios two_targets --stresses weak_brake --modes two_stage_viability,two_stage_viability_fast --physical-road-footprint rearaxle_rectangle --goal-criterion pose_gate --seed-start 0 --seeds 2 --max-time 35 --output results/phase16-known --all-traces --print-episodes --failure-traces-per-group 2
      - run: lidar-eval --scenarios two_targets --stresses weak_brake --modes two_stage_viability,two_stage_viability_fast --physical-road-footprint rearaxle_rectangle --goal-criterion pose_gate --seed-start 10 --seeds 2 --max-time 35 --output results/phase16-previous-holdout --all-traces --print-episodes --failure-traces-per-group 2
      # Truly new seed50-51 combinations under additional cross/stress geometry
      - run: lidar-eval --scenarios crossing,narrow,two_targets --stresses nominal,fast_targets --modes two_stage_viability,two_stage_viability_fast --physical-road-footprint rearaxle_rectangle --goal-criterion pose_gate --seed-start 50 --seeds 2 --max-time 35 --output results/phase16-new-cases --all-traces --print-episodes --failure-traces-per-group 2
      - run: python -m lidar_sim.equivalence_audit --folders results/phase16-known results/phase16-previous-holdout results/phase16-new-cases --output results/phase16-equivalence.csv
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase16-fast-viability-parity
          path: results/phase16-*
