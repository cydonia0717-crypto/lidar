name: Phase18 independent-reference prediction error audit
on:
  push:
    branches:
      - feat/track-prediction-error-audit
  pull_request:
    branches:
      - feat/perception-shadow-replay-contract
  workflow_dispatch:

concurrency:
  group: phase18-prediction-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prediction-reference-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest -q tests/test_tracked_shadow.py tests/test_track_prediction_audit.py
      - run: |
          python -m compileall -q src/lidar_sim
          echo "Only synthetic unit-test fixtures were exercised."
          echo "No real LiDAR accuracy or held-out empirical coverage has been established."
