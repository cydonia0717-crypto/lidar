name: Phase14 cutoff and parked intrusion
on:
  push:
    branches:
      - feat/time-horizon-parked-intrusion-forensics
  workflow_dispatch:

jobs:
  horizon-forensics:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest -q tests/test_horizon_forensics.py
      # Preserve identical policy, vehicle, seed, physical truth and pose goal.
      # Increasing max-time does NOT retroactively convert timeouts to success.
      - run: python -m lidar_sim.horizon_forensics --seeds 0,1 --horizons 30,35,40 --assumed-offset .55 --physical-offset .55 --output results/phase14-forensics
      - uses: actions/upload-artifact@v4
        with:
          name: phase14-horizon-intrusion-artifacts
          path: results/phase14-forensics
