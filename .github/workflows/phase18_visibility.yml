name: Phase18 independent target visibility audit
on:
  push:
    branches:
      - feat/phase18-independent-visibility-audit
  pull_request:
    branches:
      - feat/track-prediction-error-audit
  workflow_dispatch:

concurrency:
  group: phase18-visible-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  visible-target-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest -q tests/test_independent_visibility_audit.py tests/test_track_prediction_audit.py tests/test_tracked_shadow.py tests/test_rosbag_inventory.py
      - run: |
          python -m lidar_sim.independent_visibility_audit \
            --manifest tests/fixtures/visibility_audit/manifest.csv \
            --output results/synthetic-visibility-audit
      - run: |
          python - <<'PY'
          import csv
          from pathlib import Path
          p = Path('results/synthetic-visibility-audit/visibility_episode_summary.csv')
          with p.open(newline='') as f:
              records = list(csv.DictReader(f))
          assert len(records) == 2
          assert all(int(r['geometric_associations']) == 1 for r in records)
          assert all(int(r['visible_but_unmatched']) == 1 for r in records)
          assert any(int(r['visible_unknown_or_unscorable']) == 1 for r in records)
          print('Synthetic visible/missed/missing-snapshot events audited.')
          print('NOT real LiDAR detection recall or a safety certificate.')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: synthetic-visible-targets-not-real-lidar
          path: results/synthetic-visibility-audit/
